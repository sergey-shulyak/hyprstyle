# Hyprland color scheme - auto-generated by hyprstyle
# Do not edit manually - changes will be overwritten

# Color Variables for reference and other uses
$primary = @@PRIMARY@@
$secondary = @@SECONDARY@@
$accent = @@ACCENT@@
$background = @@BG@@
$text = @@TEXT@@
$error = @@ERROR@@
$success = @@SUCCESS@@
$warning = @@WARNING@@
$bg_dark = @@BG_DARK@@
$bg_light = @@BG_LIGHT@@
$ui_accent = @@UI_ACCENT@@

# Override border colors with gradient format
# Uses UI_ACCENT (dominant color from wallpaper) for active borders
# Gradient: bright top-left -> dim middle -> bright bottom-right (45deg diagonal)
general {
    col.active_border = rgba(@@UI_ACCENT_RGBA@@) rgba(@@BG_LIGHT_RGBA@@) rgba(@@UI_ACCENT_RGBA@@) 45deg
    col.inactive_border = rgba(@@BG_LIGHT_RGBA@@)
}
