# Font
font_family JetBrains Mono
font_size 12
disable_ligatures cursor

# Window
window_padding_width 8
window_padding_height 8
background_opacity 0.9
enable_audio_bell no
confirm_os_window_close 0

# Cursor
cursor_shape block
shell_integration no-cursor
cursor_blink_interval 0.5 ease-in-out
cursor_stop_blinking_after 15.0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Theme - auto-generated by hyprstyle
foreground ${TEXT}
background ${BG}
selection_background ${ACCENT}
selection_foreground ${BG}

# Black (0: dark, 8: bright/gray)
color0 ${BG_DARK}
color8 ${BG_LIGHT}

# Red (1: normal, 9: bright)
color1 ${ERROR}
color9 ${ERROR_BRIGHT}

# Green (2: normal, 10: bright)
color2 ${SUCCESS}
color10 ${SUCCESS_BRIGHT}

# Yellow (3: normal, 11: bright)
color3 ${WARNING}
color11 ${WARNING_BRIGHT}

# Blue (4: normal, 12: bright)
color4 ${PRIMARY}
color12 ${PRIMARY_BRIGHT}

# Magenta (5: normal, 13: bright)
color5 ${ACCENT}
color13 ${ACCENT_BRIGHT}

# Cyan (6: normal, 14: bright)
color6 ${SECONDARY}
color14 ${SECONDARY_BRIGHT}

# White (7: dim, 15: bright)
color7 ${WHITE_DIM}
color15 ${TEXT}

# Url underline
url_color ${ACCENT}
url_style curly
map shift+enter send_text all \e\r
